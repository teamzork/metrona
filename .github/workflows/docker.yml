name: Docker image

# ghcr.io/teamzork/metrona: :latest from main, :<version> and :<major> from v* tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=sha,format=long
      # Build for this runner first and try it, so a broken image is never pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: metrona:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Try the image
        run: |
          docker run --rm metrona:check --version
          docker run -d --name demo -p 3003:3003 metrona:check demo
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:3003/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:3003/api/sites | grep -q example-com
          docker rm -f demo
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
