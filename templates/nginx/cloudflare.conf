# For a site behind Cloudflare's proxy (orange cloud). There, $remote_addr is Cloudflare's edge,
# so every visitor would look like a handful of people. This writes a log for Metrona with the
# visitor's address from CF-Connecting-IP instead, in nginx's combined format, and without assets.
#
# Put this file in /etc/nginx/conf.d/ (http level), then add to the site's server block, beside
# its existing access_log:
#
#   access_log /var/log/nginx/example.com-metrona.log metrona if=$metrona_loggable;
#
# and point the site's logPath in metrona.yaml at that file. A request that reaches the origin
# directly has no header and keeps its own address. (Anyone who can reach the origin directly can
# set the header; for analytics that is harmless.)

map $http_cf_connecting_ip $metrona_client {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Assets and feeds are never pageviews; leaving them out keeps the log small.
map $uri $metrona_loggable {
    ~*\.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3|m4a|json|xml|txt|pdf|zip)$ 0;
    default 1;
}

log_format metrona '$metrona_client - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
