# Custom nginx log format for Metrona Analytics System
# This format includes all necessary fields for analytics processing

log_format analytics '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     '$request_time';

# Usage: Add this to your nginx.conf or include it in conf.d/
# Then use: access_log /var/log/nginx/site-analytics.log analytics;