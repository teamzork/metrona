# Template for per-site nginx configuration
# Replace {{DOMAIN}} and {{LOG_PATH}} with actual values

server {
    listen 80;
    server_name {{DOMAIN}};
    
    # Your existing server configuration here...
    
    # Analytics logging - add this line to existing server blocks
    access_log {{LOG_PATH}} analytics;
    
    # Optional: Exclude static assets from analytics
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|otf)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Your existing location blocks here...
}